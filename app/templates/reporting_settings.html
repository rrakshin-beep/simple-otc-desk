<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Настройки отчетности</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><div><h1>OTC Desk 2.0</h1><p>Профиль подотчетного лица</p></div><nav><a href="/dealer">Сделки</a><a href="/parties">Контрагенты</a><a href="/regulatory">Отчетность СФР</a><a href="/settings/reference-data">Справочники</a></nav></header><main>
<section class="card"><h2>Реквизиты подотчетного лица</h2><form method="post" action="/settings/reporting" class="grid wide-grid">
<label>ИНН<input name="inn" maxlength="14" required value="{{profile.inn if profile else ''}}"></label><label>Наименование<input name="person_name" maxlength="254" required value="{{profile.person_name if profile else ''}}"></label>
<label>Категория<select name="org_kind">{% set selected_kind=profile.org_kind if profile else '28' %}{% for item in organization_kinds %}<option value="{{item.CODE}}" {% if selected_kind==item.CODE %}selected{% endif %}>{{item.CODE}} — {{item.NAME}}</option>{% endfor %}</select></label><label>БИК<input name="bank_bic" maxlength="6" value="{{profile.bank_bic if profile else '00'}}"></label><label>ОКПО<input name="okpo" maxlength="8" value="{{profile.okpo if profile else '00'}}"></label><label>Организационно-правовая форма<select name="orgform_code">{% set selected_form=profile.orgform_code if profile else '20' %}{% for item in organization_forms %}<option value="{{item.CODE}}" {% if selected_form==item.CODE %}selected{% endif %}>{{item.CODE}} — {{item.NAME}}</option>{% endfor %}</select></label><label>Филиал<input name="branch" value="{{profile.branch if profile else '00'}}"></label>
<label>Индекс<input name="legal_postcode" value="{{profile.legal_postcode if profile else '00'}}"></label><label>Код населенного пункта<select name="legal_town_code"><option value="00">00 — не указан</option>{% set selected_town=profile.legal_town_code if profile else '00' %}{% for item in towns_view %}<option value="{{item.CODE}}" {% if selected_town==item.CODE %}selected{% endif %}>{{item.CODE}} — {{item.NAME}}</option>{% endfor %}</select></label><label>Область<input name="legal_region" value="{{profile.legal_region if profile else '00'}}"></label><label>Район<input name="legal_area" value="{{profile.legal_area if profile else '00'}}"></label><label>Населенный пункт<input name="legal_town" value="{{profile.legal_town if profile else '00'}}"></label><label>Улица<input name="legal_street" value="{{profile.legal_street if profile else '00'}}"></label><label>Дом<input name="legal_house" value="{{profile.legal_house if profile else '00'}}"></label><label>Офис<input name="legal_room" value="{{profile.legal_room if profile else '00'}}"></label>
<label>Ответственное лицо<input name="performer_name" value="{{profile.performer_name if profile else '00'}}"></label><label>Должность<input name="performer_post" value="{{profile.performer_post if profile else '00'}}"></label><label>Телефон<input name="phone" maxlength="12" value="{{profile.phone if profile else '00'}}"></label><button>Сохранить профиль</button></form></section>
</main></body></html>
